version: 2

models:
  - name: stg_hospital_events
    description: "Typed, deduplicated source events with trimmed activity labels and parsed BigQuery timestamps. Invalid required fields and invalid timestamps are excluded."
    columns:
      - name: case_id
        tests: [not_null]
      - name: event_id
        tests: [not_null, unique]
      - name: activity_name_normalized
        tests: [not_null]
      - name: event_timestamp
        tests: [not_null]
      - name: event_date
        tests: [not_null]
